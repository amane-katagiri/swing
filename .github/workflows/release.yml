name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, check: true, zig: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, check: false, zig: true }
          - { os: macos-latest, target: aarch64-apple-darwin, check: true, zig: false }
          - { os: macos-latest, target: x86_64-apple-darwin, check: false, zig: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, check: true, zig: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ matrix.target }}

      - name: Check tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "swing") | .version')
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Lint and test
        if: matrix.check
        shell: bash
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Install cargo-zigbuild
        if: matrix.zig
        run: |
          pip3 install --user ziglang==0.16.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        if: matrix.zig
        with:
          tool: cargo-zigbuild

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.zig }}" = true ]; then
            cargo zigbuild --release --locked -p swing --target ${{ matrix.target }}
          else
            cargo build --release --locked --workspace --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          name="swing-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp LICENSE README.md "dist/$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            cp "target/${{ matrix.target }}/release/swing.exe" "target/${{ matrix.target }}/release/swing-tray.exe" "dist/$name/"
            (cd dist && 7z a "$name.zip" "$name" >/dev/null)
          else
            cp "target/${{ matrix.target }}/release/swing" "dist/$name/"
            if [ "${{ runner.os }}" = macOS ]; then
              cp "target/${{ matrix.target }}/release/swing-tray" "dist/$name/"
            fi
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -r "dist/$name"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes ./*

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*-unknown-linux-musl"
          path: dist
          merge-multiple: true

      - name: Unpack binaries
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            arch=${pair%%:*}
            name="swing-${GITHUB_REF_NAME}-${pair#*:}-unknown-linux-musl"
            mkdir -p "context/$arch"
            tar -xzf "dist/$name.tar.gz" -C dist
            install -m 0755 "dist/$name/swing" "context/$arch/swing"
          done

      - name: Image tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            tags="$image:$version"
            case "$version" in *-*) ;; *) tags="$tags,$image:latest" ;; esac
          else
            tags="$image:$GITHUB_REF_NAME"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: context
          file: docker/release.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
