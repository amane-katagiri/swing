# パスの相対パスは、書いた値も既定値も、この設定ファイルのあるディレクトリを起点にする（環境変数で渡したパスはカレントディレクトリが起点）

[nostr]
#secret_key = "nsec1..."             # SWING_NOSTR_SECRET_KEY: 署名用の秘密鍵（nsec または hex）。省略可。無いと swing up はセットアップモードで起動し、ダッシュボードから生成・保存できる
relays = ["wss://relay.damus.io", "wss://nos.lol", "wss://relay.primal.net", "wss://yabu.me", "wss://relay-jp.nostr.wirednet.jp"]
                                     # SWING_NOSTR_RELAYS: 接続する Nostr relay（カンマ区切り）
mirror_set = "swing"                 # SWING_MIRROR_SET: Follow Set（kind 30000）の d タグ
site_event_kind = 35980              # SWING_SITE_EVENT_KIND: サイトイベントの kind
replica_event_kind = 35981           # SWING_REPLICA_EVENT_KIND: レプリカ報告イベントの kind

[ipfs]
#api = "http://127.0.0.1:5001"       # SWING_IPFS_API: Kubo RPC のエンドポイント。[kubo].managed = false のときだけ使う。managed = true で指定するとエラーになる
mfs_root = "/swing"                  # SWING_MFS_ROOT: SWING が使う MFS のディレクトリ

[policy]
max_total_storage = "100GiB"         # SWING_MAX_TOTAL_STORAGE: 保存する全サイト合計の容量上限
max_per_site = "10GiB"               # SWING_MAX_PER_SITE: 1 サイトあたりの容量上限。超えた分は古い版から削除される。新版だけで超える更新は保存されない
max_per_account = "20GiB"            # SWING_MAX_PER_ACCOUNT: 1 アカウントが持つ全サイトの合計容量上限。超える更新は保存されない
max_sites_per_account = 10           # SWING_MAX_SITES_PER_ACCOUNT: 1 アカウントあたりに保存するサイト数の上限。既に保存しているサイトの更新は続く
max_update_size = "2GiB"             # SWING_MAX_UPDATE_SIZE: 1 回の更新（1 バージョン）あたりのサイズ上限。超えると保存されない
keep_versions = 5                    # SWING_KEEP_VERSIONS: サイトごとに保持する旧バージョンの数。超えた分は古い順に削除される
keep_days = 365                      # SWING_KEEP_DAYS: バージョンを保持する日数。最新版を除き、これより古い版は削除される
min_update_interval = "1h"           # SWING_MIN_UPDATE_INTERVAL: 同じサイトを取り込む最短間隔
remove_on_unfollow = true            # SWING_REMOVE_ON_UNFOLLOW: ミラー対象から外したときに、自動でそのサイトの保存をやめるかどうか
nip05 = "warn"                       # SWING_NIP05: 保存前に行う NIP-05 検証のモード（off / warn / require）
nip05_cache_ttl = "1d"               # SWING_NIP05_CACHE_TTL: NIP-05 の検証結果を再利用する期間

[agent]
state_dir = "./data"                 # SWING_STATE_DIR: 状態ファイルを置くディレクトリ
poll_interval = "5m"                 # SWING_POLL_INTERVAL: Follow Set の再取得間隔
fetch_timeout = "15m"                # SWING_FETCH_TIMEOUT: 1 サイト分の取得全体のタイムアウト
fetch_idle_timeout = "2m"            # SWING_FETCH_IDLE_TIMEOUT: 取得中にデータが届かないまま待つ上限
concurrency = 4                      # SWING_CONCURRENCY: 同時に取得・保存するサイト数
report_ttl = "3d"                    # SWING_REPORT_TTL: レプリカ報告の有効期間。半分の期間を過ぎたら新しい報告を出す。poll_interval の 2 倍より長く、7d 以下にする必要がある（受信側はそれより古い報告を数えない）

[publish]
nip05 = "warn"                       # SWING_PUBLISH_NIP05: swing publish の NIP-05 検証モード（off / warn / require、--nip05 が優先）
keep_versions = 5                    # SWING_PUBLISH_KEEP_VERSIONS: swing publish が自分のノードに残す版の数
check_dotfiles = "require"           # SWING_PUBLISH_CHECK_DOTFILES: サイトに dotfiles_allow 以外のドットで始まる名前のファイル・ディレクトリがあったときの swing publish の扱い（off / warn / require、--check-dotfiles が優先）
dotfiles_allow = [".well-known", ".nojekyll", ".gitkeep", ".keep", ".domains"]
                                     # SWING_PUBLISH_DOTFILES_ALLOW: check_dotfiles が通すドットで始まる名前（その下も含めて通す、カンマ区切り）。指定すると既定の一覧を置き換える
check_size = "warn"                  # SWING_PUBLISH_CHECK_SIZE: サイトのファイルの合計が 512 MiB を超えたときの swing publish の扱い（off / warn / require、--check-size が優先）
check_unchanged = "require"          # SWING_PUBLISH_CHECK_UNCHANGED: 新しい CID が relay 上の自分の最新版と同じだったときの swing publish の扱い（off / warn / require。require は publish せずに終える、--check-unchanged が優先）

[dashboard]
listen = "127.0.0.1:8082"            # SWING_DASHBOARD_LISTEN: ダッシュボードの待ち受けアドレス（swing up が動いている間ずっと待ち受ける）
ui = true                            # SWING_DASHBOARD_UI: false で静的な Web UI を配信せず、/api/* の制御 API だけ残す
allowed_hosts = []                   # SWING_DASHBOARD_ALLOWED_HOSTS: Host ヘッダで追加で許可するホスト名（ポート抜き、カンマ区切り）
#public_url = "http://127.0.0.1:8082"
                                     # SWING_DASHBOARD_PUBLIC_URL: ブラウザからダッシュボードを開く URL（swing dashboard open が出すログインリンクの頭に使う）。未設定なら待ち受けアドレス
#gateway = "http://localhost:8080"   # SWING_DASHBOARD_GATEWAY: 保存済みサイトを開くリンクの IPFS Gateway。空文字にするとリンクを表示しない。既定: managed なら http://localhost:<[kubo].gateway_listen のポート>、そうでなければ http://localhost:8080
#custom_css = "/path/to/custom.css"  # SWING_DASHBOARD_CUSTOM_CSS: ダッシュボードに読み込ませる追加 CSS ファイルのパス
#desktop_page = "/path/to/links.html"
                                     # SWING_DASHBOARD_DESKTOP_PAGE: Desktop 画面のリンク集ページ（HTML）のパス。未設定なら同梱のページ
#desktop_page_css = "/path/to/links.css"
                                     # SWING_DASHBOARD_DESKTOP_PAGE_CSS: そのリンク集ページ専用の CSS ファイルのパス。未設定なら同梱の CSS
#desktop_banner = "/path/to/banner.gif"
                                     # SWING_DASHBOARD_DESKTOP_BANNER: リンク集ページの 88×31 バナー画像のパス（png/gif/jpeg/webp/svg）。未設定なら同梱の GIF
#mascots_dir = "/path/to/mascots"    # SWING_DASHBOARD_MASCOTS_DIR: ユーザー定義の Desktop マスコットパックを置くディレクトリ（1 サブディレクトリ = 1 パック）。同梱の 3 パックに加えて起動時に 1 回読み込む
max_upload = "2GiB"                  # SWING_DASHBOARD_MAX_UPLOAD: POST /api/publish/upload のボディ上限。0 はエラー

[kubo]
managed = true                       # SWING_KUBO_MANAGED: true なら swing up が Kubo を子プロセスとして動かす。false なら外部の Kubo（[ipfs].api）を使う
#binary = "/usr/local/bin/ipfs"      # SWING_KUBO_BINARY: 管理する Kubo の実行ファイルのパス。既定: swing 実行ファイルと同じディレクトリの ipfs(.exe)、無ければ PATH の ipfs
#repo = "./data/kubo"                # SWING_KUBO_REPO: 管理する Kubo のリポジトリ（IPFS_PATH）。既定: [agent].state_dir/kubo
#storage_max = "100GiB"              # SWING_KUBO_STORAGE_MAX: Kubo の Datastore.StorageMax。既定: [policy].max_total_storage と同じ値。GiB 系で書くと compose の Kubo でも同じ値になる（Kubo は GB を 10 進で解釈する）
provide_strategy = "pinned+mfs"      # SWING_KUBO_PROVIDE_STRATEGY: Kubo の Provide.Strategy
gateway_listen = "127.0.0.1:8080"    # SWING_KUBO_GATEWAY_LISTEN: 管理する Kubo の Addresses.Gateway
#swarm_port = 4001                   # SWING_KUBO_SWARM_PORT: 管理する Kubo の swarm ポート。未設定なら Kubo の既定のまま触らない

[gateway]
listen = "off"                       # SWING_GATEWAY_LISTEN: SWING 内蔵 DNSLink ゲートウェイの待ち受けアドレス（例 "127.0.0.1:8081"）。"off" で無効
hosts = []                           # SWING_GATEWAY_HOSTS: DNSLink で配信するホスト名（カンマ区切り）。listen が off でないなら必須。managed なら Kubo の Gateway.PublicGateways にも入れる
#upstream = "http://127.0.0.1:8080"  # SWING_GATEWAY_UPSTREAM: プロキシ先の Kubo gateway。既定: managed なら http://<[kubo].gateway_listen>、そうでなければ http://127.0.0.1:8080
