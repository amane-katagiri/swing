[package]
name = "swing-tray"
version = "0.1.2"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
swing = { path = ".." }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
anyhow = "1"
serde_json = "1"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.25", default-features = false }
tao = { version = "0.37", default-features = false }
png = "0.18"
sys-locale = "0.3"
rfd = { version = "0.17", default-features = false }

[[bin]]
name = "swing-tray"
path = "src/main.rs"

[build-dependencies]
winresource = { version = "0.1", default-features = false }
