[workspace]
members = ["tray"]

[package]
name = "swing"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
nostr-sdk = { version = "0.45", default-features = false, features = ["rustls-tls-webpki-roots"] }
nostr-connect = { version = "0.45", default-features = false, features = ["rustls-tls-webpki-roots"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "stream", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "io-util", "net", "process"] }
tokio-util = { version = "0.7", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cid = "0.11"
futures-util = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "multipart", "query", "tokio"] }
tower-http = { version = "0.6", default-features = false, features = ["timeout"] }
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.3"
zeroize = { version = "1.9", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Threading"] }

[dev-dependencies]
nostr-sdk = { version = "0.45", default-features = false, features = ["local-relay"] }
tempfile = "3"
tower = { version = "0.5", default-features = false, features = ["util"] }

[[bin]]
name = "swing"
path = "src/main.rs"

[build-dependencies]
winresource = { version = "0.1", default-features = false }
